name: .NET Backend CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blogdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blogdb_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore backend
      run: dotnet restore blog_backend/BlogApi/BlogApi.csproj

    - name: Restore tests
      run: dotnet restore blog_backend/BlogApi.Tests/BlogApi.Tests.csproj

    - name: Build backend
      run: dotnet build blog_backend/BlogApi/BlogApi.csproj --no-restore

    - name: Build tests
      run: dotnet build blog_backend/BlogApi.Tests/BlogApi.Tests.csproj --no-restore

    - name: Install psql client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Setup test database
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d blogdb_test <<'SQL'
          CREATE TABLE IF NOT EXISTS users (
            id SERIAL PRIMARY KEY,
            username TEXT NOT NULL,
            password_hash TEXT NOT NULL,
            role TEXT NOT NULL
          );
        SQL
        psql -h localhost -U postgres -d blogdb_test <<'SQL'
          CREATE TABLE IF NOT EXISTS posts (
            id SERIAL PRIMARY KEY,
            title TEXT NOT NULL,
            content TEXT NOT NULL,
            user_id INT REFERENCES users(id),
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            updated_at TIMESTAMP
          );
        SQL
        psql -h localhost -U postgres -d blogdb_test <<'SQL'
          INSERT INTO users (username, password_hash, role)
          VALUES 
            ('admin', 'admin123', 'admin'),
            ('staff', 'staff123', 'staff'),
            ('viewer', 'viewer123', 'viewer');
        SQL

    - name: Run tests
      run: dotnet test blog_backend/BlogApi.Tests/BlogApi.Tests.csproj --no-build
