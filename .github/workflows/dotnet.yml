name: Build and Test BlogApi

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blogdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blogdb_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          until pg_isready -h localhost -p 5432 -U postgres; do
            sleep 2
          done

      - name: Initialize database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d blogdb_test <<SQL
          CREATE TABLE IF NOT EXISTS users (
              id SERIAL PRIMARY KEY,
              username TEXT NOT NULL,
              password_hash TEXT,
              role TEXT NOT NULL
          );
          INSERT INTO users (username, password_hash, role) VALUES
              ('admin', 'admin123', 'admin')
          ON CONFLICT (username) DO NOTHING;
          INSERT INTO users (username, role) VALUES
              ('viewer', 'viewer')
          ON CONFLICT (username) DO NOTHING;
          CREATE TABLE IF NOT EXISTS posts (
              id SERIAL PRIMARY KEY,
              title TEXT NOT NULL,
              content TEXT NOT NULL
          );
SQL

      - name: Restore BlogApi
        run: dotnet restore blog_backend/BlogApi/BlogApi.csproj

      - name: Restore Tests
        run: dotnet restore blog_backend/BlogApi.Tests/BlogApi.Tests.csproj

      - name: Build BlogApi
        run: dotnet build blog_backend/BlogApi/BlogApi.csproj --no-restore

      - name: Build Tests
        run: dotnet build blog_backend/BlogApi.Tests/BlogApi.Tests.csproj --no-restore

      - name: Run Tests
        run: dotnet test blog_backend/BlogApi.Tests/BlogApi.Tests.csproj --no-build
