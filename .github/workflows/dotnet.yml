name: .NET Tests

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore blog_backend/BlogApi.sln

      - name: Build
        run: dotnet build blog_backend/BlogApi.sln --no-restore

      - name: Run tests
        run: dotnet test blog_backend/BlogApi.sln --no-build
