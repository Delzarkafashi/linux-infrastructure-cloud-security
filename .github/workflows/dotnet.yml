name: .NET Backend Tests

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blogdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blogdb_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          until pg_isready -h localhost -p 5432 -U postgres; do
            sleep 2
          done

      - name: Seed Database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d blogdb_test <<SQL
          CREATE TABLE IF NOT EXISTS users (
              id SERIAL PRIMARY KEY,
              username TEXT UNIQUE NOT NULL,
              password_hash TEXT NOT NULL,
              role TEXT NOT NULL
          );
          INSERT INTO users (username, password_hash, role)
          VALUES
              ('admin', 'admin123', 'admin'),
              ('viewer', 'viewer123', 'viewer')
          ON CONFLICT (username) DO NOTHING;

          CREATE TABLE IF NOT EXISTS posts (
              id SERIAL PRIMARY KEY,
              title TEXT NOT NULL,
              content TEXT NOT NULL,
              user_id INTEGER REFERENCES users(id),
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          INSERT INTO posts (title, content, user_id)
          VALUES
              ('Initial Post', 'Detta är ett testinlägg', 1)
          ON CONFLICT DO NOTHING;
          SQL

      - name: Restore backend
        run: dotnet restore blog_backend/BlogApi/BlogApi.csproj

      - name: Restore test project
        run: dotnet restore blog_backend/BlogApi.Tests/BlogApi.Tests.csproj

      - name: Build backend
        run: dotnet build blog_backend/BlogApi/BlogApi.csproj --no-restore

      - name: Build test project
        run: dotnet build blog_backend/BlogApi.Tests/BlogApi.Tests.csproj --no-restore

      - name: Run tests
        env:
          DOTNET_ConnectionStrings__DefaultConnection: "Host=localhost;Database=blogdb_test;Username=postgres;Password=postgres"
        run: dotnet test blog_backend/BlogApi.Tests/BlogApi.Tests.csproj --no-build
