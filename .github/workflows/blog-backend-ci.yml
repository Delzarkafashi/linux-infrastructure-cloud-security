name: Blog Backend CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'blog_backend/**'
      - '.github/workflows/blog-backend-ci.yml'

  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'blog_backend/**'
      - '.github/workflows/blog-backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore test project
        run: dotnet restore blog_backend/BlogApi.Tests/BlogApi.Tests.csproj

      - name: Build test project
        run: dotnet build blog_backend/BlogApi.Tests/BlogApi.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test blog_backend/BlogApi.Tests/BlogApi.Tests.csproj --no-build --verbosity normal
