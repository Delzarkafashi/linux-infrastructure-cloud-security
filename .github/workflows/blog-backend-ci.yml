name: Blog Backend CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'blog_backend/**'
      - '.github/workflows/blog-backend-ci.yml'

  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'blog_backend/**'
      - '.github/workflows/blog-backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: blog_backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal
