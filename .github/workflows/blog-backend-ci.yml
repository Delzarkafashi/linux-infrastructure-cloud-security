name: Blog Backend CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'blog_backend/**'
      - '.github/workflows/blog-backend-ci.yml'

  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'blog_backend/**'
      - '.github/workflows/blog-backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Kevin2004
          POSTGRES_DB: blogdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d blogdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      Jwt__Key: ${{ secrets.JWT_KEY }}
      Jwt__Issuer: ${{ secrets.JWT_ISSUER }}
      Jwt__Audience: ${{ secrets.JWT_AUDIENCE }}
      ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING }}
      PGPASSWORD: Kevin2004

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create tables and seed test data
        run: |
          psql -h localhost -U postgres -d blogdb <<'SQL'
          CREATE TABLE IF NOT EXISTS users (
              id SERIAL PRIMARY KEY,
              username VARCHAR(50) NOT NULL UNIQUE,
              password_hash TEXT NOT NULL,
              role VARCHAR(20) NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE IF NOT EXISTS posts (
              id SERIAL PRIMARY KEY,
              title TEXT NOT NULL,
              content TEXT NOT NULL,
              user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP
          );

          TRUNCATE TABLE posts, users RESTART IDENTITY CASCADE;

          INSERT INTO users (username, password_hash, role)
          VALUES
            ('admin', 'admin123', 'admin'),
            ('viewer', 'viewer123', 'viewer');

          INSERT INTO posts (title, content, user_id)
          VALUES
            ('Post 1', 'Detta är första posten', 1),
            ('Post 2', 'Detta är andra posten', 1);
          SQL

      - name: Restore test project
        run: dotnet restore blog_backend/BlogApi.Tests/BlogApi.Tests.csproj

      - name: Build test project
        run: dotnet build blog_backend/BlogApi.Tests/BlogApi.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test blog_backend/BlogApi.Tests/BlogApi.Tests.csproj --no-build --verbosity normal
